# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  schedule:
    - cron: '38 14 * * 3'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner matrices configure machines that will run the jobs.
    # We recommend choosing the latest available version for each OS.
    # Info: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idruns-on
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        # If you wish to specify build modes, you can do so here. Build modes can be 'autobuild', 'manual', or 'none'
        # If you are using workflow_call, be aware that the build mode is dictated by the caller workflow
        # Learn more at https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-a-build-mode
        - language: java-kotlin
          build-mode: manual # Set to 'manual' because we provide build steps below
        - language: javascript-typescript
          build-mode: none    # 'none' indicates no build is required for CodeQL to analyze these languages

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # *** DEBUGGING STEP ***
    # List files to see if gradlew is present after checkout
    - name: List files in workspace
      run: ls -la
      if: matrix.language == 'java-kotlin' # Only run for the Java/Kotlin job

    # ℹ️ This is the customized build step for Java/Kotlin using Gradle.
    #     -> Ensure 'gradlew' exists in your repository root for the commit being built. <-
    #     -> Adjust './gradlew clean build' if your command is different. <-
    #     -> If build needs to run in a sub-directory, add 'cd your-sub-dir' first. <-
    - if: matrix.language == 'java-kotlin' && matrix.build-mode == 'manual'
      name: Build Java-Kotlin project (Gradle)
      run: |
        echo "Attempting to build with Gradle..."
        # Grant execute permission just in case (may not be necessary if git permissions are correct)
        # This command will fail if 'gradlew' is not found by the 'ls' step above.
        chmod +x gradlew
        # Run the build command
        ./gradlew clean build

    # Perform CodeQL Analysis
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
